<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" width="48" height="48">
  <defs>
    <linearGradient id="dpGrad" x1="8" y1="4" x2="40" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff2e56"/>
      <stop offset="45%" stop-color="#c8102e"/>
      <stop offset="100%" stop-color="#830018"/>
    </linearGradient>
    <linearGradient id="dpHighlight" x1="16" y1="10" x2="24" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="dpShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#9e001f" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Droplet Container / Blood Drop with Heartbeat -->
  <path d="M24 4 C24 4 10 20 10 30 C10 37.732 16.268 44 24 44 C31.732 44 38 37.732 38 30 C38 20 24 4 24 4 Z" 
        fill="url(#dpGrad)" 
        filter="url(#dpShadow)"/>

  <!-- Left Curvature Soft Highlight -->
  <path d="M16 19 C13 24 13.5 29 15 32" 
        stroke="url(#dpHighlight)" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Pulse Line (ECG / Life Rhythm) -->
  <path d="M12 30.5 L17.5 30.5 L20 25 L23 35 L26.5 22 L29 32 L31 30.5 L36 30.5" 
        stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Small Pulse Node Beacon -->
  <circle cx="26.5" cy="22" r="1.8" fill="#ffffff"/>
</svg>
